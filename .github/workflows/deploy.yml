name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Todo dia às 06:00 (Brasília): atualiza preços e estoque a partir do fornecedor.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Se o fornecedor estiver fora do ar, publica com o catálogo já versionado no repositório.
      - name: Sincronizar catálogo do fornecedor
        continue-on-error: true
        run: node scripts/sync-catalog.mjs

      - name: Gerar site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
